<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challyze's Form Project</title>
    <link rel="stylesheet" href="formproj.css">
    <link rel="shortcut icon" href="/starry.ico" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Challyze's Form Project</h1>
    </header>
    <nav>
        <a href="#">link</a>
        <a href="#">link</a>
        <a href="#">link</a>

    </nav>
    <main>
        <h1>Join Marketing Club</h1>
        <form action="formprocessing.html" method="post">
            <fieldset>
                <legend class="leg">Student Information</legend>
                <div class="roww">
                    <label for="personname">Full Name</label>
                    <input id="personname" type="text" name="fullname" placeholder="Full Name"> 
                </div>

                <div class="roww">
                    <label for="shmemail">School Email</label>
                    <input id="shmemail" type="email" name="email" placeholder="johndo@byuh.edu"> 
                </div>

                <div class="roww">
                    <label for="idnumba">School ID Number</label>
                    <input id="idnumba" type="password" name="pass">
                </div>

                <div class="roww">
                    <label for="grad">Graduation Date</label>
                    <input id="grad" type="date" name="fullname" placeholder="text"> 
                </div>

                <div class="roww">
                    <label for="dropdon">School Year</label>
                    <select name="colors" id="dropdon">
                        <option value="blank">-------</option>
                        <option value="freshman">Freshman</option>
                        <option value="sophmore">Sophmore</option>
                        <option value="junior">Junior</option>
                        <option value="senior">Senrior</option>
                    </select>
                </div>
                <div class="checkrow">
                    <div class="spacer">Are you human?</div>
                    <label><input type="radio">Yes</label>
                    <label><input type="radio">No</label>
                </div>
                <div class="checkrow">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="remem">Are you sure?</label>
                </div>
                <div class="roww">
                    <label for="qors" >Questions or Suggestions </label>
                    <textarea name="qors" id="qors"></textarea>
                </div> 
                <div class="roww">
                    <input type="submit">
                </div> 
            </fieldset>
        </form>

        
        
    </main>
    <footer>
        &copy; 2026 Challyze Catubay

    </footer>

    
</body>

</html>
