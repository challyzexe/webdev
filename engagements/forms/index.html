<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challyze's From Engagement</title>
    <link rel="stylesheet" href="form.css">
    <link rel="shortcut icon" href="/starry.ico" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Challyze'S Web Design</h1>
    </header>
    <nav>
        <a href="#">link</a>
        <a href="#">link</a>
        <a href="#">link</a>

    </nav>
    <main>
        <div id="message"></div>
        <h1>Sign up</h1>
        <form action="formprocessing.html" method="post" id="myForm">
            <fieldset>
                <legend>Account Credentials</legend>
                <div class="formrow">
                    <label for="personname">Full Name</label>
                    <input id="personname" type="text" name="fullname" placeholder="Full Name"> 
                </div>

                <div class="formrow">
                    <label for="shmemail">Email</label>
                    <input id="shmemail" type="email" name="email" placeholder="shmemal@gmail.com"> 
                </div>

                <div class="formrow">
                    <label for="pash">Password</label>
                    <input id="pash" type="password" name="pass">
                </div>

                <div class="formrow">
                    <label for="datt">Date</label>
                    <input id="datt" type="date" name="fullname" placeholder="Full Name"> 
                </div>

                <div class="formrow">
                    <label for="dropin">Dropdown</label>
                    <select name="colors" id="dropin">
                        <option value="blank">-------</option>
                        <option value="Red">Red</option>
                        <option value="blue">blue</option>
                        <option value="green">green</option>
                    </select>
                </div>
                <div class="checkrow">
                    <div class="spacer">Are you human?</div>
                    <label><input type="radio">Yes</label>
                    <label><input type="radio">No</label>
                </div>
                <div class="checkrow">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="remem">Are you sure?</label>
                </div>
                <div class="formrow">
                    <label for="tex" >Comments?</label>
                    <textarea name="tex" id="tex"></textarea>
                </div> 
                <div class="formrow">
                    <input type="submit">
                </div> 
            </fieldset>
        </form>

        <script src="proj.js"></script>
    </main>
    <footer>
        &copy; 2026 Challyze Catubay

    </footer>

    <script src="proj.js"></script>

    
</body>

</html>
